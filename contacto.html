            <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </header>

<!------- FORMULARIO----------->
<main>
    <div class="contenedor">

        <h1>Contáctanos</h1>

        <form>

            <label for="nombres">Nombres:</label>
            <input type="text" id="nombres" name="nombres"
                    placeholder="Ingrese sus nombres" required>

            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos"
                    placeholder="Ingrese sus apellidos" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo"
                    placeholder="Ingrese su correo" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono"
                    placeholder="Ingrese su teléfono" required>

            <label for="servicio">Seleccione un servicio:</label>
            <select id="servicio" name="servicio" required>
                <option value="">-- Seleccione un servicio --</option>
                <option value="Envíos Nacionales">Envíos Nacionales</option>
                <option value="Envíos Internacionales">Envíos Internacionales</option>
                <option value="Renovación Membresía">Renovación Membresía</option>
                <option value="Consultoría de negocios">Consultoría de negocios</option>
            </select>

            <label for="region">Seleccione su región:</label>
            <select id="region" name="region" required>
                <option value="Seleccione su región">-- Seleccione su región --</option>
                <option value="Región Costa">Costa</option>
                <option value="Región Andes">Andes</option>
                <option value="Región Amazonía">Amazonía</option>
                <option value="Otros">Otros-Extranjero</option>
            </select>

            <label for="comentarios">Comentarios:</label>
            <textarea id="comentarios" name="comentarios"
                        placeholder="Escriba sus comentarios"
                        rows="5"></textarea>

            <button type="submit">Enviar formulario</button>

        </form>

    </div>
</main>
